<!-- ═══════════════════════════════════════════════════════════
     SHARED NAV BAR — paste at top of <body> in each tool page
     Change data-active to match the current page:
       "survey" | "audit" | "simulations" | "market"
═══════════════════════════════════════════════════════════ -->
<style>
  .snav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
    background: rgba(8,9,18,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem;
    font-family: 'Inter', sans-serif;
  }
  .snav-brand {
    display: flex; align-items: center; gap: 0.5rem;
    text-decoration: none; flex-shrink: 0;
  }
  .snav-brand-text {
    font-family: 'Outfit', sans-serif;
    font-size: 1rem; font-weight: 800;
    background: linear-gradient(135deg, #818cf8, #38bdf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .snav-links {
    display: flex; align-items: center; gap: 0.15rem;
  }
  .snav-link {
    display: flex; align-items: center; gap: 0.35rem;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    font-size: 0.8rem; font-weight: 500;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .snav-link:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
  .snav-link.active {
    background: rgba(129,140,248,0.15);
    color: #a5b4fc;
    font-weight: 700;
  }
  .snav-sep {
    width: 1px; height: 20px;
    background: rgba(255,255,255,0.08);
    margin: 0 0.25rem;
  }
  .snav-step {
    display: flex; align-items: center; gap: 0.25rem;
    font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: rgba(255,255,255,0.2);
    padding-right: 0.5rem;
  }
  .snav-step-num {
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-weight: 800;
  }
  .snav-step.done .snav-step-num { background: rgba(52,211,153,0.2); color: #34d399; }
  .snav-step.active-step .snav-step-num { background: rgba(129,140,248,0.3); color: #818cf8; }
  .snav-arrow { font-size: 0.55rem; opacity: 0.3; }
  @media (max-width: 640px) {
    .snav-step { display: none; }
    .snav-link span.lbl { display: none; }
    .snav-link { padding: 0.35rem 0.5rem; }
  }
</style>
